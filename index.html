<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>词汇自习室</title>
<style>
:root{--ink:#17231f;--muted:#738079;--bg:#f4f6f1;--panel:#fff;--line:#e5eae3;--green:#176b52;--pale:#e5f3ec;--red:#b84d45;--amber:#a36b16;--shadow:0 12px 40px #20352a12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1100px;margin:auto;padding:28px 24px 56px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.brand{display:flex;align-items:center;gap:12px;font-weight:750;font-size:19px}.logo{height:40px;width:40px;border-radius:14px;background:var(--green);color:white;display:grid;place-items:center;font-size:20px}.topright{display:flex;gap:10px;align-items:center}.small{font-size:13px;color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 15px;color:var(--ink);font-weight:650}.btn:hover{border-color:#a8cbbc}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.soft{background:var(--pale);border-color:var(--pale);color:var(--green)}.btn.red{background:#fff4f2;border-color:#f5dbd7;color:var(--red)}.intro{margin:22px 0 20px}.intro h1{font-size:30px;letter-spacing:-.7px;margin:0 0 7px}.intro p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px 19px;display:flex;justify-content:space-between;align-items:center}.statlabel{font-size:13px;color:var(--muted)}.statnum{font-size:27px;font-weight:750;margin-top:6px}.dot{width:10px;height:10px;border-radius:50%;background:#aebbb3}.dot.green{background:#3da37b}.dot.red{background:#d5756c}.tabs{display:flex;gap:7px;border-bottom:1px solid var(--line);margin-top:26px}.tab{border:0;background:none;color:var(--muted);padding:13px 16px;font-weight:650;border-bottom:2px solid transparent;margin-bottom:-1px}.tab.active{color:var(--green);border-bottom-color:var(--green)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:25px;margin-top:18px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.panelhead h2{font-size:18px;margin:0}.actions{display:flex;gap:9px;flex-wrap:wrap}.study{max-width:720px;margin:18px auto 0;text-align:center}.progressline{height:6px;background:#edf1ed;border-radius:99px;overflow:hidden;margin:8px 0 20px}.progressline i{display:block;height:100%;background:#43a47d;width:0%;transition:width .2s}.card{border:1px solid var(--line);background:linear-gradient(145deg,#fff,#f9fbf8);border-radius:22px;min-height:275px;padding:38px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative}.eyebrow{font-size:12px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}.word{font-weight:750;font-size:clamp(28px,5vw,44px);margin:22px 0 14px;overflow-wrap:anywhere}.meaning{font-size:23px;color:var(--green);font-weight:650;min-height:34px}.hint{font-size:13px;color:var(--muted);margin-top:20px}.cardcontrols{display:flex;justify-content:center;gap:12px;margin:17px 0}.cardcontrols .btn{min-width:145px;padding:13px}.empty{color:var(--muted);padding:45px 10px;text-align:center}.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:8px}.list{display:grid;gap:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 15px;border:1px solid var(--line);border-radius:12px}.rowword{font-weight:650}.rowmeaning{font-size:14px;color:var(--muted);text-align:right}.selectword{display:flex;align-items:center;gap:12px;cursor:pointer}.wordcheck{width:17px;height:17px;accent-color:var(--green)}.selectword{display:flex;align-items:center;gap:12px;cursor:pointer}.wordcheck{width:17px;height:17px;accent-color:var(--green)}.writebox{width:min(100%,460px);margin:20px auto}.writeprompt{font-size:12px;color:var(--muted);letter-spacing:.7px}.writemeaning{font-size:27px;font-weight:700;margin:12px 0 18px}.writebox input{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px 15px;outline:none}.writebox input:focus{border-color:#7bb59d;box-shadow:0 0 0 3px #176b5214}.feedback{min-height:26px;font-weight:650;margin:12px}.good{color:var(--green)}.bad{color:var(--red)}.modalback{position:fixed;inset:0;background:#101b17a3;display:none;align-items:center;justify-content:center;padding:18px;z-index:2}.modalback.open{display:flex}.modal{background:#fff;border-radius:18px;padding:25px;width:min(100%,530px);box-shadow:var(--shadow)}.modal h2{margin:0 0 8px}.modal p{color:var(--muted);font-size:14px;line-height:1.6}.drop{display:block;border:1.5px dashed #b9c9bf;border-radius:13px;padding:22px;text-align:center;background:#f8faf7;margin:16px 0}.drop input{display:block;margin:12px auto 0;max-width:100%}.modalfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:17px}.notice{font-size:12px;color:var(--muted);margin-top:13px}.hide{display:none!important}@media(max-width:620px){.shell{padding:17px 14px 42px}.stats{gap:8px}.stat{padding:13px 11px}.statnum{font-size:23px}.intro h1{font-size:25px}.tabs{overflow:auto}.tab{padding:12px 11px;white-space:nowrap}.panel{padding:17px}.top .small{display:none}}
</style></head>
<body><main class="shell"><header class="top"><div class="brand"><div class="logo">词</div><span>词汇自习室</span></div><div class="topright"><span class="small" id="savedLabel">内容保存在此浏览器</span><button class="btn primary" id="importBtn">导入词表</button></div></header><section class="intro"><h1>每天记一点，慢慢都会</h1><p>按记忆状态整理词汇，用翻卡和默写巩固学习。</p></section><section class="stats"><div class="stat"><div><div class="statlabel">未学习</div><div class="statnum" id="count-new">0</div></div><i class="dot"></i></div><div class="stat"><div><div class="statlabel">已会</div><div class="statnum" id="count-known">0</div></div><i class="dot green"></i></div><div class="stat"><div><div class="statlabel">不会</div><div class="statnum" id="count-again">0</div></div><i class="dot red"></i></div></section><nav class="tabs" id="tabs"><button class="tab active" data-view="new">未学习</button><button class="tab" data-view="known">已会</button><button class="tab" data-view="again">不会</button><button class="tab" data-view="write">已会默写</button></nav><section class="panel"><div class="panelhead"><h2 id="viewTitle">未学习</h2><div class="actions" id="panelActions"></div></div><div id="content"></div></section></main><div class="modalback" id="modal"><div class="modal"><h2>导入词汇</h2><p>支持 CSV 或 TSV 文件，两列分别为英文和中文。也可直接粘贴词表，每行一组，用英文逗号、制表符或分号分隔。</p><label class="drop">选择词表文件<input type="file" id="file" accept=".csv,.tsv,.txt"></label><textarea id="paste" rows="6" placeholder="English;中文\ncivilization;文明\n" style="width:100%;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px"></textarea><div class="notice" id="importNotice">导入会合并词条；相同英文不会重复添加。</div><div class="modalfoot"><button class="btn" id="cancelImport">取消</button><button class="btn primary" id="pasteImport">导入粘贴内容</button></div></div></div>
<dialog id="editDialog" style="border:0;border-radius:18px;padding:24px;width:min(92vw,460px);box-shadow:0 20px 60px #10251b33"><form id="editForm"><h2 style="margin:0 0 16px">编辑词条</h2><label style="display:block;margin:12px 0 6px">英文 / 短语</label><input id="editEnglish" required style="width:100%;padding:12px;border:1px solid #dce5dd;border-radius:10px"><label style="display:block;margin:14px 0 6px">中文释义</label><input id="editChinese" required style="width:100%;padding:12px;border:1px solid #dce5dd;border-radius:10px"><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px"><button type="button" class="btn" id="cancelEdit">取消</button><button type="submit" class="btn primary">保存修改</button></div></form></dialog><script>
(()=>{const KEY='vocab-study-v1';if(!localStorage.getItem('vocab-reset-20261110')){localStorage.removeItem(KEY);localStorage.setItem('vocab-reset-20261110','1')}let words=[];try{words=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{}let view='new',queue=[],pos=0,revealed=false,activeCard=null,writeQueue=[],writePos=0;const $=s=>document.querySelector(s);const content=$('#content'),title=$('#viewTitle'),actions=$('#panelActions');function save(){localStorage.setItem(KEY,JSON.stringify(words));render()}function count(s){return words.filter(w=>w.state===s).length}function updateStats(){[['new','new'],['known','known'],['again','again']].forEach(([id,state])=>$('#count-'+id).textContent=count(state))}function statusEmpty(label){return `<div class="empty"><b>${label}</b>这里还没有词条。点击右上角“导入词表”添加英文和中文。</div>`}function startQueue(){queue=words.filter(w=>w.state===view);for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]]}pos=0;revealed=false;activeCard=null}function learn(){title.textContent=view==='new'?'未学习':view==='known'?'已会复习':'不会复习';actions.innerHTML=view==='known'?'<button class="btn soft" id="shuffle">重新抽取</button>':'';if(!queue.length){content.innerHTML=statusEmpty('词库是空的');return}if(pos>=queue.length){content.innerHTML=`<div class="empty"><b>这一轮完成了</b>共练习 ${queue.length} 个词条。可以继续复习或切换词库。</div>`;return}const w=queue[pos];if(activeCard!==w){revealed=false;activeCard=w}content.innerHTML=`<div class="study"><div class="small">${pos+1} / ${queue.length}</div><div class="progressline"><i style="width:${(pos/queue.length)*100}%"></i></div><div class="card" id="card"><div class="eyebrow">英文</div><div class="word">${esc(w.en)}</div><div class="meaning">${revealed?esc(w.zh):''}</div><div class="hint">${revealed?'点击下方选择记忆情况':'点击卡片或按空格查看中文'}</div></div><div class="cardcontrols"><button class="btn red" id="dont">不会</button><button class="btn soft" id="flip">${revealed?'继续':'显示中文'}</button><button class="btn primary" id="know">会了</button><button class="btn" id="editCurrent">修改词条</button><button class="btn" id="deleteCurrent">删除</button></div></div>`;$('#card').onclick=()=>{revealed=true;learn()};$('#flip').onclick=()=>{revealed=!revealed;learn()};$('#dont').onclick=()=>move('again');$('#know').onclick=()=>move('known');$('#editCurrent').onclick=()=>{const current=queue[pos];$('#editEnglish').value=current.en;$('#editChinese').value=current.zh;$('#editDialog').showModal()};$('#cancelEdit').onclick=()=>$('#editDialog').close();$('#editForm').onsubmit=e=>{e.preventDefault();const current=queue[pos],newEn=$('#editEnglish').value.trim(),newZh=$('#editChinese').value.trim();if(!newEn||!newZh)return;const duplicate=words.some(w=>w!==current&&w.en.toLowerCase()===newEn.toLowerCase());if(duplicate){alert('词库中已有相同英文词条');return}current.en=newEn;current.zh=newZh;localStorage.setItem(KEY,JSON.stringify(words));$('#editDialog').close();updateStats();learn()};$('#deleteCurrent').onclick=()=>{const current=queue[pos];words=words.filter(w=>w!==current);queue=queue.filter(w=>w!==current);localStorage.setItem(KEY,JSON.stringify(words));updateStats();learn()};$('#shuffle')?.addEventListener('click',()=>{startQueue();learn()})}function move(state){if(!revealed){revealed=true;learn();return}queue[pos].state=state;pos++;revealed=false;save();learn()}let selecting=false;function list(){const set=words.filter(w=>w.state===view);title.textContent=view==='known'?'已会词库':view==='again'?'不会词库':'未学习词库';actions.innerHTML=(view==='known'?'<button class="btn soft" id="review">复习已会</button><button class="btn" id="dictation">开始默写</button>':view==='again'?'<button class="btn primary" id="review">复习不会</button>':'')+(selecting?'<button class="btn" id="cancelBulk">取消</button><button class="btn red" id="bulkDelete">删除所选</button>':'<button class="btn red" id="bulkDelete">批量删除</button>');if(!set.length){content.innerHTML=statusEmpty('词库是空的')}else content.innerHTML=`<div class="list">${set.map(w=>`<div class="row"><label class="selectword"><input type="checkbox" class="wordcheck ${selecting?'':'hide'}" value="${esc(w.en)}"><span class="rowword">${esc(w.en)}</span></label><span class="rowmeaning">${esc(w.zh)}</span></div>`).join('')}</div>`;$('#bulkDelete')?.addEventListener('click',()=>{if(!selecting){selecting=true;list();return}const chosen=[...content.querySelectorAll('.wordcheck:checked')].map(x=>x.value.toLowerCase());if(!chosen.length)return;words=words.filter(w=>!chosen.includes(w.en.toLowerCase()));selecting=false;save();list()});$('#cancelBulk')?.addEventListener('click',()=>{selecting=false;list()});$('#review')?.addEventListener('click',()=>{view=view==='known'?'known':'again';startQueue();learn()});$('#dictation')?.addEventListener('click',()=>{view='write';writeQueue=words.filter(w=>w.state==='known');writePos=0;writeMode()})}function writeMode(){title.textContent='已会默写';actions.innerHTML='<button class="btn" id="backKnown">返回已会词库</button>';if(!writeQueue.length){content.innerHTML=statusEmpty('还没有已会词汇');return}if(writePos>=writeQueue.length){content.innerHTML=`<div class="empty"><b>默写完成</b>本轮完成 ${writeQueue.length} 个词条。</div>`;return}const w=writeQueue[writePos];content.innerHTML=`<div class="study"><div class="small">${writePos+1} / ${writeQueue.length}</div><div class="progressline"><i style="width:${writePos/writeQueue.length*100}%"></i></div><div class="writebox"><div class="writeprompt">根据中文默写英文</div><div class="writemeaning">${esc(w.zh)}</div><input id="answer" autocomplete="off" placeholder="输入英文单词或短语"><div class="feedback" id="feedback"></div><div class="actions" style="justify-content:center"><button class="btn primary" id="check">检查答案</button><button class="btn" id="showAnswer">显示答案</button><button class="btn soft hide" id="next">下一个</button></div></div></div>`;const inp=$('#answer');inp.focus();function check(show=false){const fb=$('#feedback');if(show){fb.textContent='参考答案：'+w.en;fb.className='feedback';$('#next').classList.remove('hide');return}if(!inp.value.trim()){fb.textContent='先输入答案，或点“显示答案”';return}const norm=x=>x.toLowerCase().trim().replace(/[’‘]/g,"'").replace(/\s+/g,' ');if(norm(inp.value)===norm(w.en)){fb.textContent='正确！';fb.className='feedback good'}else{fb.textContent='再看一下拼写';fb.className='feedback bad';return}$('#next').classList.remove('hide')}$('#check').onclick=()=>check();$('#showAnswer').onclick=()=>check(true);$('#next').onclick=()=>{writePos++;writeMode()};inp.onkeydown=e=>{if(e.key==='Enter')check()};$('#backKnown').onclick=()=>{view='known';list()}}function render(){updateStats();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='new'||view==='studyKnown'||view==='studyAgain'){if(view!=='new'){view=view==='studyKnown'?'known':'again'}startQueue();learn()}else if(view==='write')writeMode();else list()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function parse(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];function cells(line,delim){let out=[],cur='',quoted=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(quoted&&line[i+1]==='"'){cur+='"';i++}else quoted=!quoted}else if(c===delim&&!quoted){out.push(cur.trim());cur=''}else cur+=c}out.push(cur.trim());return out}const first=lines[0],delim=first.includes('\t')?'\t':first.includes(';')?';':',';return lines.map((line,i)=>cells(line,delim)).filter((r,i)=>r.length>=2&&!(i===0&&/english|英文|mandarin|chinese|中文/i.test(r[0]))).map(r=>({en:r[0].trim(),zh:r.slice(1).join(' ').trim(),state:'new'})).filter(r=>r.en&&r.zh)}function importText(text){const incoming=parse(text);let added=0,updated=0;for(const n of incoming){const old=words.find(w=>w.en.toLowerCase()===n.en.toLowerCase());if(old){if(!old.zh&&n.zh){old.zh=n.zh;updated++}}else{words.push(n);added++}}$('#importNotice').textContent=`已识别 ${incoming.length} 条；新增 ${added} 条${updated?'，补全释义 '+updated+' 条':''}。`;if(added||updated){save();$('#paste').value='';$('#file').value='';setTimeout(()=>$('#modal').classList.remove('open'),650)}}$('#tabs').onclick=e=>{const b=e.target.closest('[data-view]');if(!b)return;view=b.dataset.view;if(view==='new'||view==='known'||view==='again')startQueue();render()};$('#importBtn').onclick=()=>{$('#modal').classList.add('open');$('#importNotice').textContent='导入会合并词条；相同英文不会重复添加。'};$('#cancelImport').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('open')};$('#pasteImport').onclick=()=>{if($('#paste').value.trim())importText($('#paste').value);else $('#importNotice').textContent='请先选择文件，或粘贴词表内容。'};$('#file').onchange=async e=>{const f=e.target.files[0];if(f)importText(await f.text())};document.onkeydown=e=>{if(e.code==='Space'&&!e.target.matches('input,textarea,button')&&(view==='new'||view==='known'||view==='again')){e.preventDefault();revealed=!revealed;learn()}if(e.key==='Escape')$('#modal').classList.remove('open')};render()})();
</script></body></html>
